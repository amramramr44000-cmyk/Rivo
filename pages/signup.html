<!doctype html><html lang="en" dir="ltr" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="../manifest.webmanifest"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Profile — Rivo</title><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page"><main class="auth-wrap"><a class="brand auth-brand" href="../index.html"><span>Rivo</span></a><section class="auth-card glass"><span class="eyebrow">START YOUR IDENTITY</span><h1>Create profile</h1><p class="muted">Create your Rivo account with secure authentication.</p><form id="signupForm"><label class="field"><span>Username</span><input id="signupUsername" required maxlength="26" autocomplete="off" placeholder="yourname"><small id="usernameHint" class="section-sub">3–26 characters: letters, numbers, . _ -</small></label><label class="field"><span>Password</span><input id="signupPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="At least 10 characters"></label><label class="field"><span>Confirm password</span><input id="signupPassword2" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="Repeat password"></label><label class="field"><span>Display name</span><input id="signupDisplay" required maxlength="60" autocomplete="name" placeholder="Your Name"></label><div class="security-check" data-human-check="signup"><button type="button" class="human-check-box" id="signupHumanCheck" aria-pressed="false" aria-label="Confirm you are human"><span class="human-check-square" aria-hidden="true"></span><span class="human-check-label">I'm human</span><span class="human-check-status" id="signupHumanStatus">Verify</span></button><div id="signupCaptchaMsg" class="captcha-note" aria-live="polite"></div></div><input class="hp-field" id="signupWebsite" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="signupMsg" class="form-message" aria-live="polite"></div><button class="btn btn-primary full" type="submit">Create my profile</button></form><div class="tip">Use a unique password. Automated submissions are rejected when the human-check signals are missing or inconsistent.</div><p class="auth-foot">Already have a profile? <a href="login.html">Sign in</a></p></section></main><div class="toast-stack"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/core.js"></script><script src="../js/app.js"></script></body></html>
