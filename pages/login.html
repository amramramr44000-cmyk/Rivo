<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Rivo</title><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page"><main class="auth-wrap"><a class="brand auth-brand" href="../index.html"><span>Rivo</span></a><section class="auth-card glass"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p class="muted">Sign in to your local Rivo account.</p><form id="loginForm"><label class="field"><span>Username</span><input id="loginUsername" required maxlength="26" autocomplete="username" placeholder="e.g. gx"></label><label class="field"><span>Password</span><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Your password"></label><div id="loginMsg" class="form-message"></div><button class="btn btn-primary full" type="submit">Enter Profile</button></form><div class="tip">Your account is stored on this device. Password verification uses PBKDF2.</div><p class="auth-foot">New here? <a href="signup.html">Create a profile</a></p></section></main><div class="toast-stack"></div><script src="../js/core.js"></script><script src="../js/app.js"></script></body></html>
