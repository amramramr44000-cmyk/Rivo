<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090e">
<title>Connecting Spotify — Rivo</title>
<link rel="stylesheet" href="../css/style.css?v=20261013-spotify-v1">
<style>
.spotify-callback-shell{min-height:100vh;display:grid;place-items:center;padding:22px}.spotify-callback-card{width:min(440px,100%);padding:28px;border:1px solid var(--border);border-radius:22px;background:rgba(18,22,30,.92);text-align:center}.spotify-callback-icon{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;display:grid;place-items:center;background:rgba(30,215,96,.12);color:#1ed760;font-size:34px}.spotify-callback-card h1{font-size:24px;margin:0 0 8px}.spotify-callback-card p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.spotify-callback-spin{width:20px;height:20px;border:2px solid rgba(30,215,96,.18);border-top-color:#1ed760;border-radius:50%;margin:22px auto 0;animation:spotifyCallbackSpin .8s linear infinite}@keyframes spotifyCallbackSpin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="spotify-callback-shell"><section class="spotify-callback-card" aria-live="polite"><div class="spotify-callback-icon" aria-hidden="true">●</div><h1>Connecting Spotify</h1><p>This page securely finishes Spotify authorization and returns you to Rivo Settings. Keep this tab open for a moment.</p><div class="spotify-callback-spin" aria-hidden="true"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/spotify-presence.js?v=20261013-spotify-v1"></script>
</body>
</html>
